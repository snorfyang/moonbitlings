name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Build bundle
        run: python3 scripts/build_bundle.py "dist/moonbitlings-${{ matrix.name }}"

      - name: Package
        run: tar -C dist -czf "moonbitlings-${{ matrix.name }}.tar.gz" "moonbitlings-${{ matrix.name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonbitlings-${{ matrix.name }}
          path: moonbitlings-${{ matrix.name }}.tar.gz

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "moonbitlings-${{ matrix.name }}.tar.gz" --clobber
